name: offboard-connect-command
on:
  repository_dispatch:
    types: [offboard-connect-command]
jobs:
  list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          issue-number: ${{ github.event.client_payload.github.payload.issue.number }}
          body: |
            Thank you for your contributions to the Posit Connect Forum! Please complete the following tasks for successfully offboarding from the project.

            ## Project Lead
              - [ ] Remove the offboardee from _NMFS Rstudio Connect group on WhitePages
              - [ ] Remove the offboardee's admin permissions on Production, Test, and Dev Connect Instances
